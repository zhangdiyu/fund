name: Update Prices

on:
  schedule:
    - cron: '17 8 * * 1'  # Every Monday at 8:17am UTC
  repository_dispatch:
    types: [update-prices]
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update prices
        run: node scripts/update-prices.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update prices [automated]'
          file_pattern: 'data/*.json'
